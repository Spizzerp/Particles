<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production PLONK Test - Particle Fund</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .output {
            background: #000;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .step {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
        }
        .step.active {
            border-color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #00ff00;
        }
        .warning {
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Production PLONK Proof Generation</h1>
        <p class="warning">⚠️ Using FULL withdrawal circuit with ~17,000 constraints</p>
        
        <div class="step">
            <h2>Step 1: Initialize Production WASM</h2>
            <button id="initBtn">Initialize Production Prover</button>
            <div class="output" id="initOutput"></div>
        </div>

        <div class="step">
            <h2>Step 2: Prepare Test Data</h2>
            <button id="prepareBtn">Generate Test Inputs</button>
            <div class="output" id="prepareOutput"></div>
        </div>

        <div class="step">
            <h2>Step 3: Generate Production Proof</h2>
            <button id="generateBtn" disabled>Generate PLONK Proof</button>
            <div class="output" id="proofOutput"></div>
        </div>

        <div class="step">
            <h2>Step 4: Submit to ICP</h2>
            <button id="submitBtn" disabled>Submit to Verifier</button>
            <div class="output" id="submitOutput"></div>
        </div>
    </div>

    <script src="/wasm/wasm_exec.js"></script>
    <script>
        let prover = null;
        let testInputs = null;
        let generatedProof = null;
        let lastProofMessage = null;

        document.getElementById('initBtn').addEventListener('click', initializeWASM);
        document.getElementById('prepareBtn').addEventListener('click', prepareTestData);
        document.getElementById('generateBtn').addEventListener('click', generateProof);
        document.getElementById('submitBtn').addEventListener('click', submitToICP);

        async function initializeWASM() {
            const output = document.getElementById('initOutput');
            const btn = document.getElementById('initBtn');
            
            try {
                btn.disabled = true;
                output.textContent = 'Loading Production WASM (20MB)...\n';
                
                const go = new Go();
                const response = await fetch('/wasm/particlefund_production_real.wasm');
                const buffer = await response.arrayBuffer();
                
                output.textContent += 'Instantiating WASM...\n';
                const result = await WebAssembly.instantiate(buffer, go.importObject);
                
                // Set up message capture
                const originalPostMessage = window.postMessage.bind(window);
                window.postMessage = (data) => {
                    if (typeof data === 'string' && data.startsWith('{')) {
                        try {
                            const parsed = JSON.parse(data);
                            console.log('WASM message:', parsed);
                            lastProofMessage = parsed;
                            
                            // Handle initialization response
                            if (parsed.timeMs !== undefined && !parsed.proof) {
                                if (parsed.success) {
                                    output.textContent += '\n✓ Production prover initialized!\n';
                                    output.textContent += 'Constraints: ~17,000 (full circuit)\n';
                                    document.querySelector('.step:nth-child(2)').classList.add('active');
                                } else if (parsed.error) {
                                    output.textContent += '\n❌ Initialization failed: ' + parsed.error + '\n';
                                }
                            }
                        } catch (e) {
                            console.error('Parse error:', e);
                        }
                    }
                    originalPostMessage(data, '*');
                };
                
                go.run(result.instance);
                
                // Wait for prover
                let attempts = 0;
                while (!window.particleFundProver && attempts < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.particleFundProver) {
                    throw new Error('Prover not available');
                }
                
                prover = window.particleFundProver;
                output.textContent += 'Calling prover.initialize()...\n';
                
                // Call initialize
                prover.initialize();
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
            } finally {
                btn.disabled = false;
            }
        }

        function prepareTestData() {
            const output = document.getElementById('prepareOutput');
            
            try {
                // Generate deterministic test values
                const leafIndex = 12345;
                const merkleIndices = [];
                for (let i = 0; i < 20; i++) {
                    merkleIndices.push((leafIndex >> i) & 1);
                }
                
                // Generate Merkle path
                const merklePath = [];
                for (let i = 0; i < 20; i++) {
                    merklePath.push(Math.floor(Math.random() * 1000000).toString());
                }
                
                // Create test inputs
                testInputs = {
                    // Private inputs
                    secret: "123456789",
                    nullifier: "987654321",
                    merklePath: merklePath,
                    merkleIndices: merkleIndices,
                    
                    // Public inputs
                    merkleRoot: "999999999",
                    nullifierHash: "888888888",
                    recipient: BigInt("0x742d35Cc6634C0532925a3b844Bc9e7595f8b123").toString(),
                    amount: "1000000000000000000", // 1 ETH
                    relayer: "0",
                    fee: "10000000000000000", // 0.01 ETH
                    refund: "0"
                };
                
                output.textContent = 'Test inputs prepared:\n';
                output.textContent += '- Circuit: Full production withdrawal\n';
                output.textContent += '- Constraints: 25,969\n';
                output.textContent += '- Merkle depth: 20 levels\n';
                output.textContent += '- Amount: 1 ETH\n';
                output.textContent += '- Fee: 0.01 ETH\n';
                
                document.getElementById('generateBtn').disabled = false;
                document.querySelector('.step:nth-child(3)').classList.add('active');
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
            }
        }

        async function generateProof() {
            const output = document.getElementById('proofOutput');
            const btn = document.getElementById('generateBtn');
            
            if (!prover || !testInputs) {
                output.innerHTML = '<span class="error">Initialize prover and prepare data first</span>';
                return;
            }
            
            try {
                btn.disabled = true;
                output.textContent = 'Generating production PLONK proof...\n';
                output.textContent += 'This uses the FULL circuit with all constraints...\n\n';
                
                const startTime = performance.now();
                
                // Reset last message
                lastProofMessage = null;
                
                // Call prover
                prover.generateProof(JSON.stringify(testInputs));
                
                // Wait for proof with timeout
                let attempts = 0;
                while (!lastProofMessage && attempts < 300) { // 30 seconds
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!lastProofMessage) {
                    throw new Error('Proof generation timeout');
                }
                
                if (!lastProofMessage.success) {
                    throw new Error(lastProofMessage.error || 'Proof generation failed');
                }
                
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                generatedProof = lastProofMessage;
                
                output.innerHTML = `<span class="success">✓ Production proof generated in ${elapsed}s!</span>\n\n`;
                output.textContent += `Proof size: ${generatedProof.proof.length/2} bytes\n`;
                output.textContent += `Public signals: ${generatedProof.publicSignals.length}\n\n`;
                output.textContent += 'This is a REAL PLONK proof with full constraints!\n';
                
                document.getElementById('submitBtn').disabled = false;
                document.querySelector('.step:nth-child(4)').classList.add('active');
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
            } finally {
                btn.disabled = false;
            }
        }

        function submitToICP() {
            const output = document.getElementById('submitOutput');
            
            if (!generatedProof) {
                output.innerHTML = '<span class="error">Generate a proof first</span>';
                return;
            }
            
            output.textContent = 'Ready to submit to ICP PLONK verifier!\n\n';
            output.textContent += 'Proof details:\n';
            output.textContent += '- Type: PLONK with KZG commitments\n';
            output.textContent += '- Curve: BN254\n';
            output.textContent += '- Constraints: ~17,000\n';
            output.textContent += '- Security: 128-bit\n\n';
            output.textContent += 'This proof can be verified on-chain by the ICP canister.';
        }
    </script>
</body>
</html>
