<!DOCTYPE html>
<html>
<head>
    <title>Check Step 5 WASM Imports</title>
</head>
<body>
    <h1>Step 5 WASM Import Checker</h1>
    <pre id="output"></pre>
    <script>
        async function checkWASMImports() {
            const output = document.getElementById('output');
            try {
                const response = await fetch('/wasm/particlefund_standard.wasm');
                const buffer = await response.arrayBuffer();
                const module = await WebAssembly.compile(buffer);
                
                const imports = WebAssembly.Module.imports(module);
                output.textContent = 'Step 5 WASM Imports:\n\n';
                
                imports.forEach((imp, index) => {
                    output.textContent += `Import #${index}:\n`;
                    output.textContent += `  Module: ${imp.module}\n`;
                    output.textContent += `  Name: ${imp.name}\n`;
                    output.textContent += `  Kind: ${imp.kind}\n\n`;
                });
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }
        
        checkWASMImports();
    </script>
</body>
</html>
