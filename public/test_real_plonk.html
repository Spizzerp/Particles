<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real PLONK Proof Test - Particle Fund</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .output {
            background: #000;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .step {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
        }
        .step.active {
            border-color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #00ff00;
        }
        input {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px;
            margin: 5px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real PLONK Proof Generation Test</h1>
        <p>Using circuits WASM with actual gnark PLONK proof generation</p>
        
        <div class="step">
            <h2>Step 1: Initialize WASM</h2>
            <button id="initBtn">Initialize Real PLONK Prover</button>
            <div class="output" id="initOutput"></div>
        </div>

        <div class="step">
            <h2>Step 2: Set Test Inputs</h2>
            <div>
                <label>Secret: <input type="text" id="secret" value="12345678901234567890" /></label><br>
                <label>Nullifier: <input type="text" id="nullifier" value="98765432109876543210" /></label><br>
                <label>Amount (wei): <input type="text" id="amount" value="1000000000000000000" /></label><br>
                <label>Recipient: <input type="text" id="recipient" value="0x742d35Cc6634C0532925a3b844Bc9e7595f8b123" /></label><br>
            </div>
            <button id="prepareBtn">Prepare Test Data</button>
            <div class="output" id="prepareOutput"></div>
        </div>

        <div class="step">
            <h2>Step 3: Generate Real PLONK Proof</h2>
            <button id="generateBtn" disabled>Generate Proof (5-10 seconds)</button>
            <div class="output" id="proofOutput"></div>
        </div>

        <div class="step">
            <h2>Step 4: Verify with ICP Canister</h2>
            <button id="verifyBtn" disabled>Verify Proof on ICP</button>
            <div class="output" id="verifyOutput"></div>
        </div>
    </div>

    <!-- Load Go WASM support -->
    <script src="/wasm/wasm_exec.js"></script>
    
    <script>
        let prover = null;
        let testInputs = null;
        let generatedProof = null;
        let messageHandler = null;

        // Initialize buttons
        document.getElementById('initBtn').addEventListener('click', initializeWASM);
        document.getElementById('prepareBtn').addEventListener('click', prepareTestData);
        document.getElementById('generateBtn').addEventListener('click', generateProof);
        document.getElementById('verifyBtn').addEventListener('click', verifyProof);

        async function initializeWASM() {
            const output = document.getElementById('initOutput');
            const btn = document.getElementById('initBtn');
            
            try {
                btn.disabled = true;
                output.textContent = 'Loading Real PLONK WASM...\n';
                
                // Initialize Go WASM
                const go = new Go();
                const response = await fetch('/wasm/particlefund_prover_real_gnark.wasm');
                const buffer = await response.arrayBuffer();
                const result = await WebAssembly.instantiate(buffer, go.importObject);
                
                // Set up message handler for worker-style communication
                messageHandler = (event) => {
                    if (event.data) {
                        handleProverMessage(event.data);
                    }
                };
                
                // Store original postMessage
                const originalPostMessage = window.postMessage.bind(window);
                
                // Override postMessage to capture WASM output
                window.postMessage = (data, targetOrigin, transfer) => {
                    // If it's a string that looks like JSON, it's probably from our WASM
                    if (typeof data === 'string' && data.startsWith('{')) {
                        try {
                            const parsed = JSON.parse(data);
                            messageHandler({ data: parsed });
                        } catch (e) {
                            // Not JSON, pass through
                            originalPostMessage(data, targetOrigin, transfer);
                        }
                    } else {
                        // Pass through non-WASM messages
                        originalPostMessage(data, targetOrigin, transfer);
                    }
                };
                
                // Run WASM
                go.run(result.instance);
                
                // Wait for prover to be available
                let attempts = 0;
                while (!window.particleFundProver && attempts < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.particleFundProver) {
                    throw new Error('Prover not available after initialization');
                }
                
                prover = window.particleFundProver;
                output.textContent += 'WASM loaded successfully!\n';
                output.textContent += 'Initializing constraint system...\n';
                
                // Initialize the prover
                prover.initialize();
                
                // Wait for initialization to complete
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                output.textContent += 'Real PLONK prover initialized!\n';
                output.textContent += 'Constraint system: ~1000 constraints\n';
                output.textContent += 'Ready to generate real proofs.\n';
                
                // Find all step divs and activate the second one
                const steps = document.querySelectorAll('.step');
                if (steps.length >= 2) {
                    steps[1].classList.add('active');
                }
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        function prepareTestData() {
            const output = document.getElementById('prepareOutput');
            
            try {
                const secret = document.getElementById('secret').value;
                const nullifier = document.getElementById('nullifier').value;
                const amount = document.getElementById('amount').value;
                const recipient = document.getElementById('recipient').value.replace('0x', '');
                
                // Generate random Merkle tree position
                const leafPosition = Math.floor(Math.random() * 1048576); // 2^20
                
                // Convert position to binary indices
                const merkleIndices = [];
                for (let i = 0; i < 20; i++) {
                    merkleIndices.push((leafPosition >> i) & 1);
                }
                
                // Generate random Merkle path
                const merklePath = [];
                for (let i = 0; i < 20; i++) {
                    // Random 256-bit values as strings
                    const randomValue = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER).toString();
                    merklePath.push(randomValue);
                }
                
                // Compute nullifier hash (mock for now)
                const nullifierHash = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER).toString();
                
                // Mock Merkle root
                const merkleRoot = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER).toString();
                
                // Convert hex addresses to decimal strings for gnark
                const recipientBigInt = BigInt("0x" + recipient);
                const relayerBigInt = BigInt("0x0000000000000000000000000000000000000000");
                
                testInputs = {
                    // Private inputs
                    secret: secret,
                    nullifier: nullifier,
                    merklePath: merklePath,
                    merkleIndices: merkleIndices,
                    
                    // Public inputs  
                    merkleRoot: merkleRoot,
                    nullifierHash: nullifierHash,
                    recipient: recipientBigInt.toString(), // Convert to decimal string
                    amount: amount,
                    relayer: relayerBigInt.toString(), // Convert to decimal string
                    fee: "0",
                    refund: "0"
                };
                
                output.textContent = 'Test inputs prepared:\n';
                output.textContent += `- Secret: ${secret}\n`;
                output.textContent += `- Nullifier: ${nullifier}\n`;
                output.textContent += `- Amount: ${amount} wei\n`;
                output.textContent += `- Recipient: 0x${recipient}\n`;
                output.textContent += `  (as decimal: ${recipientBigInt.toString()})\n`;
                output.textContent += `- Leaf Position: ${leafPosition}\n`;
                output.textContent += `- Merkle Indices: [${merkleIndices.join(',')}]\n`;
                output.textContent += '\nReady to generate proof!\n';
                
                document.getElementById('generateBtn').disabled = false;
                const steps = document.querySelectorAll('.step');
                if (steps.length >= 3) {
                    steps[2].classList.add('active');
                }
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
            }
        }

        async function generateProof() {
            const output = document.getElementById('proofOutput');
            const btn = document.getElementById('generateBtn');
            
            if (!prover || !testInputs) {
                output.innerHTML = '<span class="error">Please initialize prover and prepare data first</span>';
                return;
            }
            
            try {
                btn.disabled = true;
                output.textContent = 'Generating real PLONK proof...\n';
                output.textContent += 'This will take 5-10 seconds...\n\n';
                
                const startTime = performance.now();
                
                // Set up promise to wait for response
                const proofPromise = new Promise((resolve, reject) => {
                    window.proofResolver = resolve;
                    window.proofRejecter = reject;
                });
                
                // Call generateProof
                prover.generateProof(JSON.stringify(testInputs));
                
                // Wait for response
                const result = await proofPromise;
                
                const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                
                if (!result.success) {
                    throw new Error(result.error || 'Proof generation failed');
                }
                
                generatedProof = result;
                
                output.innerHTML += `<span class="success">✓ Proof generated in ${elapsed} seconds!</span>\n\n`;
                output.textContent += `Proof size: ${result.proof.length} characters (${result.proof.length/2} bytes)\n`;
                output.textContent += `Public signals: ${result.publicSignals.length} values\n\n`;
                output.textContent += 'Proof (hex): ' + result.proof.substring(0, 100) + '...\n\n';
                output.textContent += 'Public Signals:\n';
                output.textContent += '  [0] Merkle Root: ' + result.publicSignals[0] + '\n';
                output.textContent += '  [1] Nullifier Hash: ' + result.publicSignals[1] + '\n';
                output.textContent += '  [2] Recipient: ' + result.publicSignals[2] + '\n';
                output.textContent += '  [3] Relayer: ' + result.publicSignals[3] + '\n';
                output.textContent += '  [4] Fee: ' + result.publicSignals[4] + '\n';
                output.textContent += '  [5] Amount: ' + result.publicSignals[5] + '\n';
                if (result.publicSignals[6]) {
                    output.textContent += '  [6] Additional: ' + result.publicSignals[6] + '\n';
                }
                
                document.getElementById('verifyBtn').disabled = false;
                const steps2 = document.querySelectorAll('.step');
                if (steps2.length >= 4) {
                    steps2[3].classList.add('active');
                }
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        function handleProverMessage(data) {
            console.log('Prover message:', data);
            
            // Handle different message types
            if (data.type === 'log') {
                console.log('[WASM]', data.message);
                // Also append to output if we're initializing
                const initOutput = document.getElementById('initOutput');
                if (initOutput && initOutput.textContent.includes('Loading')) {
                    initOutput.textContent += data.message + '\n';
                }
            } else if (data.type === 'initialized') {
                console.log('WASM initialized successfully');
            } else if (data.success !== undefined) {
                // This is a proof response
                console.log('Proof response received, resolving promise...');
                if (window.proofResolver) {
                    window.proofResolver(data);
                    window.proofResolver = null;
                    window.proofRejecter = null;
                } else {
                    console.warn('No proofResolver found!');
                }
            } else if (data.error) {
                // This is an error
                if (window.proofRejecter) {
                    window.proofRejecter(new Error(data.error));
                    window.proofResolver = null;
                    window.proofRejecter = null;
                }
            }
        }

        async function verifyProof() {
            const output = document.getElementById('verifyOutput');
            
            if (!generatedProof) {
                output.innerHTML = '<span class="error">Please generate a proof first</span>';
                return;
            }
            
            try {
                output.textContent = 'Connecting to ICP PLONK verifier...\n';
                output.textContent += 'Canister ID: asrmz-lmaaa-aaaaa-qaaeq-cai\n\n';
                
                // TODO: Parse the binary proof and submit to ICP
                output.textContent += 'To complete verification:\n';
                output.textContent += '1. Parse the binary PLONK proof\n';
                output.textContent += '2. Convert to ICP format\n';
                output.textContent += '3. Call plonk_verifier canister\n\n';
                
                output.textContent += 'Proof data ready for submission!\n';
                
            } catch (error) {
                output.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
