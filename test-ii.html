<!DOCTYPE html>
<html>
<head>
    <title>Test Internet Identity</title>
</head>
<body>
    <h1>Internet Identity Test</h1>
    <button id="loginBtn">Login with Internet Identity</button>
    <div id="result"></div>
    
    <script type="module">
        import { AuthClient } from 'https://esm.sh/@dfinity/auth-client@2.4.1';
        
        const loginBtn = document.getElementById('loginBtn');
        const resultDiv = document.getElementById('result');
        
        loginBtn.addEventListener('click', async () => {
            try {
                const authClient = await AuthClient.create();
                
                await authClient.login({
                    identityProvider: 'http://localhost:4943/?canisterId=rdmx6-jaaaa-aaaaa-aaadq-cai',
                    onSuccess: async () => {
                        const identity = authClient.getIdentity();
                        const principal = identity.getPrincipal();
                        resultDiv.innerHTML = `<p>Success! Principal: ${principal.toString()}</p>`;
                    },
                    onError: (error) => {
                        resultDiv.innerHTML = `<p>Error: ${error}</p>`;
                    }
                });
            } catch (error) {
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
